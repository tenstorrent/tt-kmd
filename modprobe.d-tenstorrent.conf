# Tenstorrent AI kernel driver configuration

# Maximum number of tenstorrent devices (chips) to support. (uint)
# options tenstorrent max_devices=16

# DMA address bits, 0 for automatic. (uint)
# options tenstorrent dma_address_bits=0

# Maximum number of times to reset device during boot. (uint)
# options tenstorrent reset_limit=10

# Timeout duration in seconds for M3 auto reset to occur. (byte)
# options tenstorrent auto_reset_timeout=10

# Honor write-combining mmap requests for BARs and TLB windows. When off,
# the driver maps them uncached instead, so the CPU does not speculatively
# read through them. Costs host-to-device write bandwidth. Does not cover
# sysfs resource*_wc files, nor a BAR that an x86 WC MTRR or an existing WC
# mapping of the same pages already makes write-combining. On non-x86 hosts
# uncached means device memory: unaligned accesses (e.g. memcpy/memset)
# through these mappings can fault with SIGBUS. (bool)
# options tenstorrent wc_mappings=1
